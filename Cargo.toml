[package]
name = "pm3-rs"
version = "0.1.2"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["ss0832"]
description = "Rust-native PM3 semiempirical NDDO method with MOPAC special atoms and lanthanide sparkles: heats of formation, analytic gradients and Hessians, D3/H4/X corrections, optimization, Rust, Python and ASE APIs."
autobins = false

[lib]
name = "pm3_rs"
path = "src/lib.rs"
# `rlib` for native builds/tests/CLI; `cdylib` for the maturin-built Python extension.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "pm3_rs_cli"
path = "src/bin/pm3_rs.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std", "linalg", "rayon"] }
rayon = "1.10"
pyo3 = { version = "0.23.5", optional = true, features = ["extension-module", "abi3-py39"] }

[features]
default = []
python = ["pyo3"]
